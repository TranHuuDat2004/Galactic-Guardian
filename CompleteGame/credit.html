<!DOCTYPE html>
<html lang="vi">

<head>

    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <header class="header-placeholder"></header>





<!-- ================== PHẦN GHI DANH (CREDITS) ================== -->
<section class="credits-section" style="padding: 60px 0; text-align: center; color: white;">
  <div class="container" style="max-width: 800px; margin: auto;">

    <!-- Tên Game -->
    <h1 style="font-size: 2.5em; margin-bottom: 10px;">GALACTIC GUARDIAN</h1>
    
    <!-- Tác giả chính -->
    <p style="font-size: 1.2em; opacity: 0.9; margin-bottom: 50px;">
      A game created by<br>
      <span style="font-weight: bold; font-size: 1.3em;">Trần Hữu Đạt</span>
    </p>

    <!-- ==== Đội Ngũ Phát Triển ==== -->
    <div class="credit-category" style="margin-bottom: 40px;">
      <h3 style="font-size: 1.1em; text-transform: uppercase; letter-spacing: 2px; border-bottom: 1px solid rgba(255, 255, 255, 0.3); padding-bottom: 10px; margin-bottom: 20px;">
        -- Team --
      </h3>
      <div class="credit-list" style="line-height: 1.8;">
        <p><strong>Programming:</strong> Trần Hữu Đạt</p>
        <p><strong>VFX:</strong> Đào Minh Phúc</p>
        <p><strong>Assets:</strong> Hồ Thị Mỹ Hoa</p>
      </div>
    </div>

    <!-- ==== Nguồn Tham Khảo ==== -->
    <div class="credit-category" style="margin-bottom: 40px;">
      <h3 style="font-size: 1.1em; text-transform: uppercase; letter-spacing: 2px; border-bottom: 1px solid rgba(255, 255, 255, 0.3); padding-bottom: 10px; margin-bottom: 20px;">
        -- Credits --
      </h3>
      <div class="credit-list" style="line-height: 1.8;">
        <p>Music from "Chicken Invaders 4"</p>
      </div>
    </div>

    <!-- ==== Lời Cảm Ơn Đặc Biệt ==== -->
    <div class="credit-category" style="margin-bottom: 50px;">
      <p style="font-style: italic; opacity: 0.9;">
        A very special thanks to our instructor<br>
        <span style="font-weight: bold; font-size: 1.2em;">Thầy Vũ Đình Hồng</span><br>
        for his guidance in Game Programming.
      </p>
    </div>

    <!-- Lời Cảm ơn cuối cùng -->
    <h2 style="font-size: 1.8em; font-weight: bold;">Thanks for playing!</h2>

  </div>
</section>
<!-- ================== KẾT THÚC CREDITS ================== -->

    <footer class="footer-placeholder"></footer>
